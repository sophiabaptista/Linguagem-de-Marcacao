<!DOCTYPE html>
<html lang="pt-br">
	<head> 
		<meta charset="UTF-8">
		<title>Exemplo 2 - Tabela</title>
	</head>
	<body>
		<table border="1" width="100%">
			<tr style="background-color: purple; color: white">
				<th>Cabeçalho 1</th>
				<th>Cabeçalho 2</th>
				<th>Cabeçalho 3</th>
			</tr>
			<tr>
				<td style="background-color: #000; color: #FFF;">Conteúdo 1</td>
				<td>
					<table border="1" width="100%">
						<tr>
							<td style="background-color: yellow;">1</td>
							<td style="background-color: red; color: #FFF; text-align:right;">2</td>
						</tr>
						<tr>
							<td style="background-color: blue; color: #FFF; text-align:right;">3</td>
							<td style="background-color: greenyellow;">4</td> 
						</tr>
					</table>
				</td>
				<td style="background-image:url('https://cdn.colab55.com/images/1584396681/u/como-usar-o-circulo-cromatico-para-escolher-as-cores-na-decoracao-share.png');">Conteúdo 3</td>
			</tr>
			<tr> 
				<td style="background-color: #000; color: #FFF;">Conteúdo 4</td>
				<td style="background-image: url('https://images.tcdn.com.br/img/img_prod/703418/papel_de_parede_adesivo_zig_zag_cinza_24_2_20200217074958.jpg'); text-align: right">Conteúdo 5</td>
				<td>
					<table border="1" width="100%">
						<tr>
							<td style="background-color: orange; text-align:center">5</td>
							<td style="background-color:pink;">6</td>
						</tr>
						<tr>
							<td style="background-color: red; text-align:right;">7</td>
							<td style="background-color: orange; text-align:center;">8</td> 
						</tr>
					</table>
				</td>
			</tr> 
		</table>
	</body>
</html>
