<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title>Float</title>
        <link rel="stylesheet" type="text/css" href="style.css">
    </head>
    <body>
        <h2>Float</h2>
        <p>Serve para mudar a posição do elemento na tela,
            seguindo seu ancestral mais próximo.</p>
        <ul>
            <li>Float: left; -> flutua para esquerda</li>
            <li>Float: right; -> flutua para direita</li>
            <li>Float: both; -> limpa os estilos anteriores</li>
        </ul>

        <br><br>

        <div>
            <h3>Float: left;</h3>
            <p class="esquerda">Um texto....</p>
            <img src="https://46781.cdn.simplo7.net/static/46781/sku/quadros-por-tema-paisagens-e-natureza-quadro-retangular-paisagem-litoranea-ao-anoitecer--p-1633033574294.jpg">
        </div>

        <div>
            <h3>Float: left;</h3>
            <p class="direita">Um texto....</p>
            <img class="direita "src="https://46781.cdn.simplo7.net/static/46781/sku/quadros-por-tema-paisagens-e-natureza-quadro-retangular-paisagem-litoranea-ao-anoitecer--p-1633033574294.jpg">
        </div>

        <p class="limpar">Um texto qualquer!</p>
    </body>
</html>
