<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <titel>position: relavite;</titel>
        <style>
            .static{
                position: static;
                border: 3px solid #73ad21;
                margin-top: 10%;
            }
            .relative{
                position: static;
                margin-left: 30px;
                border: 3px solid #73ad21;
            }
        </style>
    </head>
    <body>
        <div class="static">
            Essa div tem o estilo position: static;
        </div>

        <div class="relative">
            Essa div tem o estilo position: relative;
        </div>
    </body>
</html>
